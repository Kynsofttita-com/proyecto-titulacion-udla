apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: escuela

resources:
  - postgres.yml
  - rabbitmq.yml
  - minio.yml
  - eureka.yml
  - api-gateway.yml
  - ms-auth.yml
  - ms-estudiantes.yml
  - ms-instructores.yml
  - ms-vehiculos.yml
  - ms-asignaciones.yml
  - ms-cobros.yml
  - ms-reportes.yml
  - ms-notificaciones.yml

commonLabels:
  app.kubernetes.io/name: proyecto-titulacion
  app.kubernetes.io/version: v1.0.0
  managed-by: argocd

commonAnnotations:
  description: "Sistema de Control Administrativo para Escuelas de Conducción"
