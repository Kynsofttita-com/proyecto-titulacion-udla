# =============================================================================
# Frontend CI - Build y bundle
# =============================================================================
# Workflow que se ejecuta cuando hay cambios en el frontend.
# Valida que el SPA Vue 3 compila correctamente y publica el bundle como
# artifact descargable.
#
# Etapas:
#   1. Checkout del codigo
#   2. Setup Node 20 LTS con cache de npm
#   3. npm ci (install reproducible desde package-lock.json)
#   4. vite build (produce dist/)
#   5. Upload dist/ como artifact
#
# Nota: vue-tsc esta temporalmente fuera por bug upstream con TS 5.6+ Node 22.
# Se reactivara cuando salga vue-tsc compatible. Mientras tanto vite hace su
# propio type-checking (errores de tipos se ven en build).
# =============================================================================

name: Frontend CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'
  workflow_dispatch:

# Cancelar runs anteriores si hay un nuevo push al mismo branch
concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build Vue 3 SPA
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Display environment info
        run: |
          echo "Node version: $(node -v)"
          echo "npm version: $(npm -v)"

      - name: Install dependencies (reproducible)
        run: npm ci

      - name: Vite build (production bundle)
        run: npx vite build

      - name: Report bundle stats
        if: always()
        run: |
          if [ -d dist ]; then
            echo "=== Bundle generado ==="
            du -sh dist
            echo ""
            echo "=== Top 10 archivos por tamano ==="
            find dist -type f -exec du -h {} + | sort -rh | head -10
          else
            echo "ERROR: directorio dist/ no existe"
            exit 1
          fi

      - name: Upload bundle as artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 7
          if-no-files-found: error
