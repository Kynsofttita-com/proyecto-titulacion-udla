        condition: service_healthy
      postgresql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  # Frontend (Vue.js)
  frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile
    container_name: proyecto-frontend
    environment:
      VITE_API_URL: http://localhost:8080
    ports:
      - "3000:80"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - proyecto-network
    depends_on:
      api-gateway:
        condition: service_healthy

  # ============================================================================
  # HERRAMIENTAS & MONITOREO
  # ============================================================================

  # Adminer - Admin BD
  adminer:
    image: adminer:latest
    container_name: proyecto-adminer
    ports:
      - "8089:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgresql
    networks:
      - proyecto-network
    depends_on:
      - postgresql

  # Jenkins - CI/CD Pipeline
  jenkins:
    build:
      context: ../jenkins
      dockerfile: Dockerfile
    container_name: proyecto-jenkins
    environment:
      JAVA_OPTS: -Duser.timezone=America/Guayaquil
      JENKINS_OPTS: --httpPort=8090
    ports:
      - "8090:8090"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - proyecto-network
    depends_on:
      - postgresql
      - rabbitmq

volumes:
  jenkins_home:
  postgres_data:

networks:
  proyecto-network:
    driver: bridge
