apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Heredar de base
bases:
  - ../../base

# Namespace para staging
namespace: proyecto-staging

# Replicas para staging (1 por servicio)
replicas:
  - name: ms-auth
    count: 1
  - name: ms-estudiantes
    count: 1
  - name: ms-instructores
    count: 1
  - name: ms-vehiculos
    count: 1
  - name: ms-asignaciones
    count: 1
  - name: ms-cobros
    count: 1
  - name: ms-reportes
    count: 1
  - name: ms-notificaciones
    count: 1

# Etiquetas específicas de staging
commonLabels:
  environment: staging

# Patches para staging
patchesStrategicMerge:
  - replica-patch.yaml
  - resource-patch.yaml

# ConfigMap de staging
configMapGenerator:
  - name: app-config
    literals:
      - ENVIRONMENT=staging
      - LOG_LEVEL=DEBUG
      - SPRING_PROFILES_ACTIVE=staging

# Secretos de staging
secretGenerator:
  - name: db-credentials
    literals:
      - DB_HOST=postgres-staging
      - DB_PORT=5432

# Imágenes con tag staging
images:
  - name: ms-auth
    newTag: staging-latest
  - name: ms-estudiantes
    newTag: staging-latest
  - name: ms-instructores
    newTag: staging-latest
  - name: ms-vehiculos
    newTag: staging-latest
  - name: ms-asignaciones
    newTag: staging-latest
  - name: ms-cobros
    newTag: staging-latest
  - name: ms-reportes
    newTag: staging-latest
  - name: ms-notificaciones
    newTag: staging-latest
