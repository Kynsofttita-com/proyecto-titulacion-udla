# =============================================================================
# Docker Build Validation
# =============================================================================
# Workflow que valida en cada PR que las 10 imágenes Docker del stack se
# construyen sin errores (sin hacer push a ningún registry).
#
# Esto detecta tempranamente problemas en:
#   - Dockerfile.spring (sintaxis, ARG/ENV, healthcheck)
#   - docker-compose.yml (rutas, build context, dependencias)
#   - .dockerignore (archivos faltantes/sobrantes en el build context)
#
# Más adelante (Sprint 12), este workflow también hará push a un registry
# (GHCR / Docker Hub) cuando se merge a main para deployment a Oracle Cloud.
# =============================================================================

name: Docker Build

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'infrastructure/docker/**'
      - '.github/workflows/docker-build.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - 'infrastructure/docker/**'
      - '.github/workflows/docker-build.yml'
  workflow_dispatch:

concurrency:
  group: docker-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-docker-build:
    name: Validar build de imágenes Docker
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            image=moby/buildkit:latest

      - name: Build all Docker images (sin push)
        run: |
          docker compose -f infrastructure/docker/docker-compose.yml build \
            --progress=plain

      - name: List built images
        run: |
          echo "=== Imágenes construidas ==="
          docker images "escuela/*" --format "table {{.Repository}}:{{.Tag}}\t{{.Size}}"

      - name: Validate images can start (smoke test)
        run: |
          echo "=== Iniciando solo Eureka para smoke test ==="
          docker compose -f infrastructure/docker/docker-compose.yml up -d eureka-server
          echo "Esperando que Eureka esté healthy (max 2 min)..."
          for i in $(seq 1 24); do
            if docker compose -f infrastructure/docker/docker-compose.yml ps eureka-server | grep -q "healthy"; then
              echo "OK: Eureka healthy en $((i*5))s"
              break
            fi
            sleep 5
          done
          docker compose -f infrastructure/docker/docker-compose.yml ps
          echo ""
          echo "=== Logs de Eureka ==="
          docker compose -f infrastructure/docker/docker-compose.yml logs eureka-server | tail -30

      - name: Cleanup
        if: always()
        run: |
          docker compose -f infrastructure/docker/docker-compose.yml down -v
