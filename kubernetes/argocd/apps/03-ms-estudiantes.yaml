---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-estudiantes
  namespace: escuela-conduccion
  labels:
    app: ms-estudiantes
    version: v1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-estudiantes
  template:
    metadata:
      labels:
        app: ms-estudiantes
        version: v1
    spec:
      containers:
      - name: ms-estudiantes
        image: ms-estudiantes:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8082
          name: http
        env:
        - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
          value: "http://eureka:8761/eureka/"
        - name: SERVER_PORT
          value: "8082"
        - name: SPRING_APPLICATION_NAME
          value: "ms-estudiantes"
        - name: SPRING_DATASOURCE_URL
          value: "jdbc:postgresql://postgres:5432/escuela_db"
        - name: SPRING_DATASOURCE_USERNAME
          value: "escuela_user"
        - name: SPRING_DATASOURCE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: POSTGRES_PASSWORD
        - name: SPRING_JPA_HIBERNATE_DDL_AUTO
          value: "update"
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 8082
          initialDelaySeconds: 60
          periodSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 8082
          initialDelaySeconds: 30
          periodSeconds: 5
          failureThreshold: 3

---
apiVersion: v1
kind: Service
metadata:
  name: ms-estudiantes
  namespace: escuela-conduccion
  labels:
    app: ms-estudiantes
spec:
  type: ClusterIP
  ports:
  - port: 8082
    targetPort: 8082
    name: http
  selector:
    app: ms-estudiantes
