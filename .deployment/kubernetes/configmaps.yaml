apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: proyecto-titulacion
data:
  SPRING_PROFILES_ACTIVE: "prod"
  SPRING_JPA_DATABASE: "POSTGRESQL"
  SPRING_DATASOURCE_PLATFORM: "postgresql"
  SPRING_JPA_HIBERNATE_DDL_AUTO: "validate"
  SPRING_JPA_SHOW_SQL: "false"
  MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: "health,info,metrics"
  LOGGING_LEVEL_ROOT: "INFO"
  LOGGING_LEVEL_COM_ESCUELA: "DEBUG"
  JAVA_OPTS: "-Duser.timezone=America/Guayaquil -Xmx512m -Xms256m"
  SERVER_SERVLET_CONTEXT_PATH: "/"

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: database-init
  namespace: proyecto-titulacion
data:
  init-db.sh: |
    #!/bin/bash
    set -e

    psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" <<-EOSQL
      CREATE SCHEMA IF NOT EXISTS escuela;
      GRANT ALL PRIVILEGES ON SCHEMA escuela TO "$POSTGRES_USER";
    EOSQL

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: rabbitmq-config
  namespace: proyecto-titulacion
data:
  rabbitmq.conf: |
    default_user = guest
    default_pass = guest
    default_vhost = /
    management.tcp.port = 15672
