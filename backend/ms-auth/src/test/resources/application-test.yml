# =============================================================================
# Configuración de tests - MS-Auth
# =============================================================================
# Override de la configuración para perfil "test":
# - Usa H2 en memoria con MODE=PostgreSQL para que las entidades JPA con
#   @Table(schema = "auth_schema") funcionen igual que en producción.
# - INIT crea los schemas auth_schema y shared_schema antes de Hibernate.
# - Desactiva Eureka (no necesita registrarse en tests).
# - Desactiva Flyway (H2 maneja schema con Hibernate ddl-auto=create-drop).
# - Desactiva auto-configuración de RabbitMQ.
# =============================================================================

spring:
  datasource:
    url: "jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;INIT=CREATE SCHEMA IF NOT EXISTS auth_schema\\;CREATE SCHEMA IF NOT EXISTS shared_schema"
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        default_schema: auth_schema

  flyway:
    enabled: false

  rabbitmq:
    host: localhost
    port: 5672

  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false

logging:
  level:
    root: WARN
    com.escuela: INFO
