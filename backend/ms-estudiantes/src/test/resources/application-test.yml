# =============================================================================
# Configuración de tests - MS-Auth
# =============================================================================
# Override de la configuración para perfil "test":
# - Usa H2 en memoria (no requiere Postgres real para tests unitarios)
# - Desactiva Eureka (no necesita registrarse)
# - Desactiva Flyway (H2 maneja schema con Hibernate ddl-auto=create-drop)
# - Desactiva auto-configuración de RabbitMQ (los tests que la necesiten la activan)
# =============================================================================

spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        default_schema: PUBLIC

  flyway:
    enabled: false

  rabbitmq:
    host: localhost
    port: 5672

  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false

logging:
  level:
    root: WARN
    com.escuela: INFO
