apiVersion: v1
kind: Service
metadata:
  name: eureka
  namespace: escuela-conduccion
spec:
  ports:
    - port: 8761
      targetPort: 8761
  selector:
    app: eureka
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: eureka
  namespace: escuela-conduccion
spec:
  replicas: 1
  selector:
    matchLabels:
      app: eureka
  template:
    metadata:
      labels:
        app: eureka
    spec:
      containers:
        - name: eureka
          image: ghcr.io/kynsofttita-com/proyecto-titulacion-udla/eureka:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8761
          env:
            - name: EUREKA_CLIENT_REGISTER_WITH_EUREKA
              value: "false"
            - name: EUREKA_CLIENT_FETCH_REGISTRY
              value: "false"
            - name: JAVA_OPTS
              valueFrom:
                configMapKeyRef: { name: app-config, key: JAVA_OPTS }
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8761 }
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8761 }
            initialDelaySeconds: 90
            periodSeconds: 30
          resources:
            requests: { cpu: "100m", memory: "384Mi" }
            limits:   { cpu: "500m", memory: "768Mi" }
