  # Frontend (Vue.js)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: proyecto-frontend
    environment:
      VITE_API_URL: http://localhost:8080
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - proyecto-network
    depends_on:
      api-gateway:
        condition: service_healthy

  # Base de datos - Admin (Adminer para ver BD)
  adminer:
    image: adminer:latest
    container_name: proyecto-adminer
    ports:
      - "8088:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgresql
    networks:
      - proyecto-network
    depends_on:
      - postgresql

volumes:
  postgres_data:

networks:
  proyecto-network:
    driver: bridge
