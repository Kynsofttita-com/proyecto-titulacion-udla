apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: proyecto-titulacion
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Kynsofttita-com/proyecto-titulacion-udla
    targetRevision: main
    path: .deployment/kubernetes
  destination:
    server: https://kubernetes.default.svc
    namespace: proyecto-titulacion
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
  revisionHistoryLimit: 10
