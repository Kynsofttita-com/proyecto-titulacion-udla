# =============================================================================
# MS-Auth - Configuración
# =============================================================================
# Microservicio de autenticación, autorización y configuración del sistema.
# Schema BD: notificaciones_schema
# =============================================================================

server:
  port: 8088

spring:
  application:
    name: ms-notificaciones

  # ---------------------------------------------------------------------------
  # Datasource (PostgreSQL)
  # ---------------------------------------------------------------------------
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:escuela_db}?currentSchema=notificaciones_schema
    username: ${POSTGRES_USER:escuela_user}
    password: ${POSTGRES_PASSWORD:changeme}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000

  # ---------------------------------------------------------------------------
  # JPA / Hibernate
  # ---------------------------------------------------------------------------
  jpa:
    hibernate:
      ddl-auto: validate  # Las tablas las crea Flyway, no Hibernate
    properties:
      hibernate:
        default_schema: notificaciones_schema
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          time_zone: UTC
    show-sql: false
    open-in-view: false

  # ---------------------------------------------------------------------------
  # Flyway (migraciones)
  # ---------------------------------------------------------------------------
  flyway:
    enabled: true
    baseline-on-migrate: true
    schemas: notificaciones_schema
    default-schema: notificaciones_schema
    locations: classpath:db/migration

  # ---------------------------------------------------------------------------
  # RabbitMQ (eventos asíncronos)
  # ---------------------------------------------------------------------------
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: ${RABBITMQ_VHOST:/}
    listener:
      simple:
        retry:
          enabled: true
          initial-interval: 1000
          max-attempts: 3
          multiplier: 2.0

  # ---------------------------------------------------------------------------
  # Cache (Caffeine in-memory)
  # ---------------------------------------------------------------------------
  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=1000,expireAfterWrite=10m

  # ---------------------------------------------------------------------------
  # Jackson (JSON)
  # ---------------------------------------------------------------------------
  jackson:
    serialization:
      write-dates-as-timestamps: false
      indent-output: false
    deserialization:
      fail-on-unknown-properties: false
    time-zone: UTC

  # ---------------------------------------------------------------------------
  # Mail (Sprint 4 / T4.4)
  # En dev usamos Mailtrap; en prod Gmail SMTP. Ver .env.example.
  # ---------------------------------------------------------------------------
  mail:
    host: ${MAIL_HOST:sandbox.smtp.mailtrap.io}
    port: ${MAIL_PORT:2525}
    # Alias: se aceptan MAIL_USERNAME/MAIL_PASSWORD (estandar, en .env) o
    # MAILTRAP_USER/MAILTRAP_PASSWORD (nombres viejos) por compatibilidad.
    username: ${MAIL_USERNAME:${MAILTRAP_USER:}}
    password: ${MAIL_PASSWORD:${MAILTRAP_PASSWORD:}}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  # ---------------------------------------------------------------------------
  # Thymeleaf (templates de emails)
  # ---------------------------------------------------------------------------
  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    mode: HTML
    encoding: UTF-8
    cache: false  # true en prod

# -----------------------------------------------------------------------------
# Configuracion de notificaciones (Sprint 4 / T4.4)
# -----------------------------------------------------------------------------
escuela:
  notificaciones:
    # Si false, los listeners persisten en log_envios_email con estado PENDIENTE
    # pero NO envian email real (util para dev sin credenciales SMTP).
    mail-enabled: ${JAVA_MAIL_ENABLED:false}
    from-email: ${MAIL_FROM:no-reply@escuela-conduccion.local}
    from-name: ${MAIL_FROM_NAME:Escuela de Conduccion}
    # URL base del frontend (para construir links de reset password, etc.)
    frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:5173}

# -----------------------------------------------------------------------------
# Eureka Client - registrar este MS en el servicio de descubrimiento
# -----------------------------------------------------------------------------
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${random.uuid}
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30

# -----------------------------------------------------------------------------
# Actuator (healthchecks, métricas)
# -----------------------------------------------------------------------------
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  health:
    rabbit:
      enabled: true
    db:
      enabled: true
    # Sprint 4 / T4.5: mail health requiere conectarse al SMTP. Desactivamos
    # para que el contenedor no quede unhealthy cuando no hay credenciales
    # Mailtrap (modo dry-run). El envio real se valida via log_envios_email.
    mail:
      enabled: false

# -----------------------------------------------------------------------------
# OpenAPI / Swagger UI
# -----------------------------------------------------------------------------
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

# -----------------------------------------------------------------------------
# Logging
# -----------------------------------------------------------------------------
logging:
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    com.escuela.notificaciones: ${LOG_LEVEL_APP:DEBUG}
    org.hibernate.SQL: ${LOG_LEVEL_SQL:WARN}
    org.springframework.amqp: WARN

# -----------------------------------------------------------------------------
# Resilience4j (circuit breakers para llamadas a otros MS)
# -----------------------------------------------------------------------------
resilience4j:
  circuitbreaker:
    instances:
      default:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        permitted-number-of-calls-in-half-open-state: 3
        wait-duration-in-open-state: 30s
        failure-rate-threshold: 50
  retry:
    instances:
      default:
        max-attempts: 3
        wait-duration: 1s
