apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-estudiantes
  namespace: escuela
  labels:
    app: ms-estudiantes
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-estudiantes
  template:
    metadata:
      labels:
        app: ms-estudiantes
    spec:
      containers:
      - name: ms-estudiantes
        image: escuela/ms-estudiantes:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 8082
        env:
        - name: SPRING_PROFILES_ACTIVE
          value: kubernetes
        - name: SERVER_PORT
          value: "8082"
        - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
          value: "http://eureka-server:8761/eureka/"
        - name: SPRING_DATASOURCE_URL
          value: "jdbc:postgresql://postgres:5432/escuela_db"
        - name: SPRING_DATASOURCE_USERNAME
          value: "escuela_user"
        - name: SPRING_DATASOURCE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: POSTGRES_PASSWORD
        - name: JWT_SECRET
          value: "c2VjcmV0LWp3dC1rZXktZm9yLWVzY3VlbGEtY29uZHVjY2lvbi1taW5pa3ViZS1kZW1vLXZhbGlkLTUxMi1iaXRzLWxlbmd0aC1tdXN0LWJl"
        - name: RABBITMQ_HOST
          value: "rabbitmq"
        - name: RABBITMQ_PORT
          value: "5672"
        - name: SPRING_RABBITMQ_HOST
          value: "rabbitmq"
        - name: SPRING_RABBITMQ_PORT
          value: "5672"
        resources:
          requests:
            memory: "384Mi"
            cpu: "100m"
          limits:
            memory: "768Mi"
            cpu: "500m"
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 8082
          initialDelaySeconds: 120
          periodSeconds: 15
          timeoutSeconds: 10
          failureThreshold: 10
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 8082
          initialDelaySeconds: 300
          periodSeconds: 60
          timeoutSeconds: 10
          failureThreshold: 5
---
apiVersion: v1
kind: Service
metadata:
  name: ms-estudiantes
  namespace: escuela
spec:
  selector:
    app: ms-estudiantes
  ports:
  - port: 8082
    targetPort: 8082
  type: ClusterIP
