# ============================================================================
# Secrets template — reemplaza los placeholders antes de aplicar.
# NO commitear este archivo con valores reales.
#
# Genera los base64 con:  echo -n 'valor-real' | base64
# O usa stringData (K8s se encarga del encoding) como aca abajo.
# ============================================================================
---
apiVersion: v1
kind: Secret
metadata:
  name: db-secrets
  namespace: escuela-conduccion
type: Opaque
stringData:
  POSTGRES_USER: "postgres"
  POSTGRES_PASSWORD: "postgres123"                 # ← CAMBIAR en prod
  SPRING_DATASOURCE_USERNAME: "postgres"
  SPRING_DATASOURCE_PASSWORD: "postgres123"        # ← CAMBIAR en prod
---
apiVersion: v1
kind: Secret
metadata:
  name: rabbitmq-secrets
  namespace: escuela-conduccion
type: Opaque
stringData:
  RABBITMQ_DEFAULT_USER: "guest"
  RABBITMQ_DEFAULT_PASS: "guest"                    # ← CAMBIAR en prod
  SPRING_RABBITMQ_USERNAME: "guest"
  SPRING_RABBITMQ_PASSWORD: "guest"                 # ← CAMBIAR en prod
---
apiVersion: v1
kind: Secret
metadata:
  name: minio-secrets
  namespace: escuela-conduccion
type: Opaque
stringData:
  MINIO_ROOT_USER: "minioadmin"
  MINIO_ROOT_PASSWORD: "minioadmin123"              # ← CAMBIAR en prod
  MINIO_ACCESS_KEY: "minioadmin"
  MINIO_SECRET_KEY: "minioadmin123"                 # ← CAMBIAR en prod
---
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: escuela-conduccion
type: Opaque
stringData:
  # JWT — clave HS512 de 512 bits (64 chars). Generar nueva en prod.
  JWT_SECRET: "miSecretaJWT123SecureKey256BitsBitsBitsMasBitsParaHS512-CambiarEnProd!"

  # Mailtrap / SMTP — mismos valores que estan en el .env del compose.
  MAIL_USERNAME: "201c12ab0aa914"                   # ← reemplazar por el real
  MAIL_PASSWORD: "82ef624938d7ef"                   # ← reemplazar por el real
