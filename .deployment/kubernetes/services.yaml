apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: proyecto-titulacion
  labels:
    app: api-gateway
spec:
  type: LoadBalancer
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
  selector:
    app: api-gateway

