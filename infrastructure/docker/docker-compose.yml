services:
  # Base de Datos
  postgresql:
    image: postgres:15-alpine
    container_name: proyecto-postgres
    environment:
      POSTGRES_DB: proyecto_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - proyecto-network

  # Message Broker
  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: proyecto-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - proyecto-network

  # Service Discovery
  eureka:
    build:
      context: .
      dockerfile: ./Dockerfile.spring
      args:
        SERVICE_MODULE: eureka-server
        JAR_NAME: eureka-server
        SERVICE_PORT: 8761
    container_name: proyecto-eureka
    environment:
      SPRING_APPLICATION_NAME: eureka-server
      SERVER_PORT: 8761
      JAVA_OPTS: -Duser.timezone=America/Guayaquil
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8761/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 180s
    networks:
      - proyecto-network
    depends_on:
      - postgresql
      - rabbitmq

  # API Gateway
  api-gateway:
    build:
      context: .
      dockerfile: ./Dockerfile.spring
      args:
        SERVICE_MODULE: api-gateway
        JAR_NAME: api-gateway
        SERVICE_PORT: 8080
    container_name: proyecto-gateway
    environment:
      SPRING_APPLICATION_NAME: api-gateway
      SERVER_PORT: 8080
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka:8761/eureka/
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgresql:5432/proyecto_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres123
      JAVA_OPTS: -Duser.timezone=America/Guayaquil
      JWT_SECRET: ${JWT_SECRET:-miSecretaJWT123SecureKey256BitsBitsBits}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 180s
    networks:
      - proyecto-network
    depends_on:
      eureka:
        condition: service_healthy
      postgresql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  # MS-Auth
  ms-auth:
    build:
      context: .
      dockerfile: ./Dockerfile.spring
      args:
        SERVICE_MODULE: ms-auth
        JAR_NAME: ms-auth
        SERVICE_PORT: 8081
    container_name: proyecto-ms-auth
    environment:
      SPRING_APPLICATION_NAME: ms-auth
      SERVER_PORT: 8081
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka:8761/eureka/
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgresql:5432/proyecto_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres123
      JAVA_OPTS: -Duser.timezone=America/Guayaquil
      JWT_SECRET: ${JWT_SECRET:-miSecretaJWT123SecureKey256BitsBitsBits}
