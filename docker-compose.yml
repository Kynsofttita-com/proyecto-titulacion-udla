    ports:
      - "8084:8084"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8084/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 180s
    networks:
      - proyecto-network
    depends_on:
      eureka:
        condition: service_healthy

  # MS-Asignaciones
