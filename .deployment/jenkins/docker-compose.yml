version: '3.8'

services:
  # Jenkins - CI/CD (standalone deployment)
  jenkins:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: proyecto-jenkins
    environment:
      JAVA_OPTS: -Duser.timezone=America/Guayaquil
      JENKINS_OPTS: --httpPort=8090
    ports:
      - "8090:8090"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - proyecto-network
    depends_on:
      - postgresql
      - rabbitmq

volumes:
  jenkins_home:

networks:
  proyecto-network:
    driver: bridge
