version: '3.8'

services:
  # ====================================================================
  # PostgreSQL Database (Shared)
  # ====================================================================
  postgres:
    image: postgres:15-alpine
    container_name: proyecto-postgres
    environment:
      POSTGRES_DB: escuela_db
      POSTGRES_USER: escuela_user
      POSTGRES_PASSWORD: changeme
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - proyecto-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U escuela_user -d escuela_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ====================================================================
  # RabbitMQ Message Broker
  # ====================================================================
  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: proyecto-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - proyecto-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ====================================================================
  # SonarQube (Code Quality Analysis)
  # ====================================================================
  sonarqube:
    image: sonarqube:latest
    container_name: proyecto-sonarqube
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://postgres:5432/sonarqube
      SONAR_JDBC_USERNAME: escuela_user
      SONAR_JDBC_PASSWORD: changeme
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLED: 'true'
    ports:
      - "9000:9000"
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_logs:/opt/sonarqube/logs
    networks:
      - proyecto-network
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/api/system/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  # ====================================================================
  # Jenkins (CI/CD Pipeline)
  # ====================================================================
  jenkins:
    image: jenkins/jenkins:lts-jdk21
    container_name: proyecto-jenkins
    user: root
    ports:
      - "8080:8080"
      - "50000:50000"
    environment:
      JENKINS_OPTS: "--httpPort=8080"
      JAVA_OPTS: "-Xmx2g -Xms512m"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - proyecto-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  # ====================================================================
  # MinIO (S3-compatible Object Storage)
  # ====================================================================
  minio:
    image: minio/minio:latest
    container_name: proyecto-minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9001:9001"
      - "9000:9000"
    volumes:
      - minio_data:/minio_data
    command: server /minio_data --console-address ":9001"
    networks:
      - proyecto-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ====================================================================
  # Redis (Caching)
  # ====================================================================
  redis:
    image: redis:7-alpine
    container_name: proyecto-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - proyecto-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ====================================================================
  # Prometheus (Monitoring & Metrics)
  # ====================================================================
  prometheus:
    image: prom/prometheus:latest
    container_name: proyecto-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - proyecto-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9090/-/healthy || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  # ====================================================================
  # Grafana (Visualization & Dashboards)
  # ====================================================================
  grafana:
    image: grafana/grafana:latest
    container_name: proyecto-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_INSTALL_PLUGINS: grafana-piechart-panel
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - proyecto-network
    depends_on:
      - prometheus
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

networks:
  proyecto-network:
    driver: bridge

volumes:
  postgres_data:
  rabbitmq_data:
  sonarqube_data:
  sonarqube_logs:
  jenkins_home:
  minio_data:
  redis_data:
  prometheus_data:
  grafana_data:
