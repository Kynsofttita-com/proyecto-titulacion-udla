# =============================================================================
# Backend CI/CD Enhanced - Build, Tests, Quality Gates y Seguridad
# =============================================================================
# Workflow mejorado con:
#   - Build y tests
#   - JaCoCo coverage (80% minimum)
#   - SonarQube análisis de código
#   - OWASP Dependency-Check
#   - Quality gates
#   - Reportes de seguridad
#
# Se ejecuta en: push a main, pull requests, manual
# =============================================================================

name: Backend CI/CD Enhanced

on:
  push:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci-enhanced.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'backend/**'
  workflow_dispatch:

concurrency:
  group: backend-ci-enhanced-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write
  pull-requests: write
  actions: read
  security-events: write

jobs:
  # =========================================================================
  # STAGE 1: BUILD & TESTS
  # =========================================================================
  build-and-test:
    name: Build, Tests y Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history para SonarQube

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Display environment info
        run: |
          echo "Java version:"
          java -version
          echo ""
          echo "Maven version:"
          mvn -version

      - name: Build, test and generate coverage report
        working-directory: backend
        run: mvn -B -ntp clean verify

      - name: Upload JaCoCo coverage reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-coverage-reports
          path: backend/**/target/site/jacoco/
          retention-days: 30

      - name: Upload Surefire test reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: surefire-test-reports
          path: backend/**/target/surefire-reports/
          retention-days: 30

      - name: Publish test results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Maven Tests
          path: backend/**/target/surefire-reports/*.xml
          reporter: java-junit
          fail-on-error: false

      - name: Check coverage threshold (80%)
        working-directory: backend
        run: |
          # First try the aggregated report at the root backend directory
          JACOCO_REPORT="./target/site/jacoco/index.html"
          if [ ! -f "$JACOCO_REPORT" ]; then
            echo "⚠️  JaCoCo aggregated report not found at $JACOCO_REPORT"
            echo "Searching for module reports in pom-level location..."
            JACOCO_REPORT=$(find . -path '*/target/site/jacoco/index.html' | grep -v '.m2' | head -1)
            if [ -z "$JACOCO_REPORT" ]; then
              echo "❌ No JaCoCo reports found"
              ls -la ./target/ 2>/dev/null || echo "No ./target directory"
              find . -name "jacoco.exec" 2>/dev/null || echo "No jacoco.exec files found"
              exit 1
            fi
          fi
          echo "✅ Using report: $JACOCO_REPORT"
          COVERAGE=$(grep -oP 'Total.*?<td class="ctr2">\K[0-9]+' "$JACOCO_REPORT" | head -1 || echo "0")
          echo "Code Coverage: $COVERAGE%"
          if (( $(echo "$COVERAGE < 80" | bc -l) )); then
            echo "❌ Coverage below 80% threshold"
            exit 1
          fi
          echo "✅ Coverage meets threshold"

  # =========================================================================
  # STAGE 2: CODE QUALITY (SonarQube)
  # =========================================================================
  sonarqube-analysis:
    name: SonarQube Code Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: build-and-test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build for SonarQube
        working-directory: backend
        run: mvn -B -ntp clean verify -DskipTests

      - name: SonarQube Scan
        working-directory: backend
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL || 'http://localhost:9000' }}
          SONAR_LOGIN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mvn -B -ntp sonar:sonar \
            -Dsonar.projectKey=proyecto-titulacion-backend \
            -Dsonar.projectName="Proyecto Titulación - Backend" \
            -Dsonar.sources=src/main \
            -Dsonar.tests=src/test \
            -Dsonar.host.url=$SONAR_HOST_URL \
            -Dsonar.login=$SONAR_LOGIN

      - name: Check SonarQube Quality Gate
        run: |
          echo "✅ Quality gate check (configurar en SonarQube dashboard)"

  # =========================================================================
  # STAGE 3: DEPENDENCY CHECK (OWASP)
  # =========================================================================
  dependency-check:
    name: OWASP Dependency Check
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run OWASP Dependency-Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          path: 'backend'
          format: 'All'
          args: >
            --project "Proyecto-Titulacion-Backend"
            --enable-retired

      - name: Upload Dependency-Check reports
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-reports
          path: reports/
          retention-days: 30

      - name: Comment PR with Dependency Check results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const reportPath = 'reports/dependency-check-report.json';
            if (fs.existsSync(reportPath)) {
              const report = JSON.parse(fs.readFileSync(reportPath, 'utf8'));
              const vulnerabilities = report.reportSchema?.reportInfo?.statistics?.critical || 0;
              const message = `📊 **Dependency Check Results**\n- Critical: ${vulnerabilities}`;
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: message
              });
            }

  # =========================================================================
  # STAGE 4: SECURITY SCANNING
  # =========================================================================
  security-scan:
    name: Security Scanning
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21 (for Maven cache)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        continue-on-error: true
        with:
          scan-type: 'fs'
          scan-ref: 'backend'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v2
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
          category: 'trivy'

      - name: Run secret scanning
        uses: gitleaks/gitleaks-action@v2
        with:
          source: 'backend'
          verbose: true
          redact: true
          config-path: .gitleaksrc

  # =========================================================================
  # STAGE 5: DOCKER BUILD (si todo pasa)
  # =========================================================================
  docker-build:
    name: Docker Build & Scan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [build-and-test, sonarqube-analysis, dependency-check, security-scan]
    if: success()

    strategy:
      matrix:
        service:
          - ms-auth
          - ms-estudiantes
          - ms-instructores
          - ms-vehiculos
          - ms-asignaciones
          - ms-cobros
          - ms-reportes
          - ms-notificaciones

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image for ${{ matrix.service }}
        uses: docker/build-push-action@v5
        with:
          context: backend/${{ matrix.service }}
          file: backend/${{ matrix.service }}/Dockerfile
          push: false
          tags: proyecto-titulacion/${{ matrix.service }}:latest
          outputs: type=docker,dest=/tmp/${{ matrix.service }}.tar

      - name: Scan ${{ matrix.service }} image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          input: '/tmp/${{ matrix.service }}.tar'
          format: 'json'
          output: '${{ matrix.service }}-trivy-results.json'

      - name: Upload Docker scan results
        uses: actions/upload-artifact@v4
        with:
          name: docker-scan-${{ matrix.service }}
          path: '${{ matrix.service }}-trivy-results.json'

  # =========================================================================
  # STAGE 6: QUALITY GATE SUMMARY
  # =========================================================================
  quality-gate-summary:
    name: Quality Gate Summary
    runs-on: ubuntu-latest
    needs: [build-and-test, sonarqube-analysis, dependency-check, security-scan, docker-build]
    if: always()

    steps:
      - name: Check Quality Gates
        run: |
          echo "═══════════════════════════════════════════════════"
          echo "✅ QUALITY GATE SUMMARY"
          echo "═══════════════════════════════════════════════════"
          echo ""
          echo "✅ Tests & Coverage: ${{ needs.build-and-test.result }}"
          echo "✅ SonarQube Analysis: ${{ needs.sonarqube-analysis.result }}"
          echo "✅ Dependency Check: ${{ needs.dependency-check.result }}"
          echo "✅ Security Scan: ${{ needs.security-scan.result }}"
          echo "✅ Docker Build: ${{ needs.docker-build.result }}"
          echo ""
          echo "═══════════════════════════════════════════════════"

          if [ "${{ needs.build-and-test.result }}" != "success" ] || \
             [ "${{ needs.sonarqube-analysis.result }}" != "success" ] || \
             [ "${{ needs.dependency-check.result }}" != "success" ] || \
             [ "${{ needs.security-scan.result }}" != "success" ]; then
            echo "❌ PIPELINE FAILED - Quality gates not met"
            exit 1
          fi

          echo "✅ ALL QUALITY GATES PASSED"

      - name: Comment PR with results
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const status = '${{ needs.build-and-test.result }}' === 'success' ? '✅' : '❌';
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `${status} **Pipeline Status**\n- Tests: ${{ needs.build-and-test.result }}\n- SonarQube: ${{ needs.sonarqube-analysis.result }}\n- Deps: ${{ needs.dependency-check.result }}\n- Security: ${{ needs.security-scan.result }}`
            });
