# =============================================================================
# Configuración de tests - ms-estudiantes
# =============================================================================
# - Usa H2 en memoria con MODE=PostgreSQL para que las entidades JPA con
#   @Table(schema = "estudiantes_schema") funcionen igual que en producción.
# - INIT crea el schema antes de Hibernate.
# - Desactiva Eureka, Flyway, RabbitMQ.
# =============================================================================

spring:
  datasource:
    url: "jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;INIT=CREATE SCHEMA IF NOT EXISTS estudiantes_schema";CREATE SCHEMA IF NOT EXISTS shared_schema
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        default_schema: estudiantes_schema

  flyway:
    enabled: false

  rabbitmq:
    host: localhost
    port: 5672

  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false

logging:
  level:
    root: WARN
    com.escuela: INFO
