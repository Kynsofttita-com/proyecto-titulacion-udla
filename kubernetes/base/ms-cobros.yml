apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-cobros
  namespace: escuela
  labels:
    app: ms-cobros
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ms-cobros
  template:
    metadata:
      labels:
        app: ms-cobros
    spec:
      containers:
      - name: ms-cobros
        image: escuela/ms-cobros:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8086
          name: http
        env:
        - name: SPRING_PROFILES_ACTIVE
          value: kubernetes
        - name: SERVER_PORT
          value: "8086"
        - name: SPRING_DATASOURCE_URL
          value: "jdbc:postgresql://postgres:5432/escuela_db?currentSchema=cobros_schema"
        - name: SPRING_DATASOURCE_USERNAME
          valueFrom:
            configMapKeyRef:
              name: postgres-config
              key: POSTGRES_USER
        - name: SPRING_DATASOURCE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: POSTGRES_PASSWORD
        - name: SPRING_RABBITMQ_HOST
          value: rabbitmq
        - name: SPRING_RABBITMQ_PORT
          value: "5672"
        - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
          value: "http://eureka-server:8761/eureka/"
        - name: EUREKA_INSTANCE_HOSTNAME
          value: ms-cobros
        - name: JAVA_OPTS
          value: "-Duser.timezone=America/Guayaquil"
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 8086
          initialDelaySeconds: 180
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 8086
          initialDelaySeconds: 60
          periodSeconds: 10
          timeoutSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: ms-cobros
  namespace: escuela
  labels:
    app: ms-cobros
spec:
  selector:
    app: ms-cobros
  ports:
  - port: 8086
    targetPort: 8086
    name: http
  type: ClusterIP
  clusterIP: None
