apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-config
  namespace: escuela
data:
  POSTGRES_DB: escuela_db
  POSTGRES_USER: escuela_user
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: escuela
type: Opaque
stringData:
  POSTGRES_PASSWORD: "escuela123"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: escuela
  labels:
    app: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - name: postgres
        image: postgres:15-alpine
        ports:
        - containerPort: 5432
        env:
        - name: POSTGRES_DB
          valueFrom:
            configMapKeyRef:
              name: postgres-config
              key: POSTGRES_DB
        - name: POSTGRES_USER
          valueFrom:
            configMapKeyRef:
              name: postgres-config
              key: POSTGRES_USER
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: POSTGRES_PASSWORD
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        readinessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - escuela_user
            - -d
            - escuela_db
          initialDelaySeconds: 10
          periodSeconds: 10
        livenessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - escuela_user
            - -d
            - escuela_db
          initialDelaySeconds: 30
          periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: escuela
spec:
  selector:
    app: postgres
  ports:
  - port: 5432
    targetPort: 5432
  type: ClusterIP
