# =============================================================================
# Docker Build Validation
# =============================================================================
# Workflow que valida en cada PR que el Dockerfile.spring funciona correctamente
# construyendo UNA imagen de prueba (eureka-server, la mas simple y rapida).
#
# Como las 10 imagenes Spring usan el MISMO Dockerfile.spring parametrizado,
# si una se construye correctamente, las demas tambien lo haran. Construir las
# 10 en cada PR consume ~30 min de runner gratuito de GitHub Actions y suele
# fallar por timeout. Esta version es rapida (~3-5 min).
#
# El build COMPLETO de las 10 imagenes se hace antes de cada deploy a produccion
# (Sprint 12 cuando agreguemos el workflow de deploy a Oracle Cloud).
# =============================================================================

name: Docker Build

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'infrastructure/docker/**'
      - '.github/workflows/docker-build.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - 'infrastructure/docker/**'
      - '.github/workflows/docker-build.yml'
  workflow_dispatch:

concurrency:
  group: docker-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-docker-build:
    name: Validar build de imágenes Docker
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build eureka-server image (smoke test del Dockerfile.spring)
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./infrastructure/docker/Dockerfile.spring
          build-args: |
            MODULE=eureka-server
            SERVICE_PORT=8761
          push: false
          tags: escuela/eureka-server:0.0.1-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Inspect built image
        run: |
          docker images escuela/eureka-server:0.0.1-test
          echo ""
          echo "=== Smoke test: arrancar el contenedor 30s y verificar logs ==="
          docker run -d --name eureka-test -p 8761:8761 escuela/eureka-server:0.0.1-test
          sleep 30
          docker logs eureka-test 2>&1 | tail -30

          # Validar que Spring Boot levantó (busca el patrón típico)
          if docker logs eureka-test 2>&1 | grep -q "Started EurekaServerApplication"; then
            echo "OK: EurekaServerApplication arranco correctamente"
          else
            echo "FAIL: EurekaServerApplication no logro arrancar"
            exit 1
          fi

      - name: Cleanup
        if: always()
        run: |
          docker rm -f eureka-test 2>/dev/null || true
